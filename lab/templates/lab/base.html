{% load static %}<!doctype html>
<html lang="{{ lang }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ t.intro }}"><title>Áurea Lab — {{ t.tagline }}</title>
<link rel="icon" type="image/svg+xml" href="{% static 'lab/favicon.svg' %}">
<link rel="stylesheet" href="{% static 'lab/app.css' %}"></head>
<body><a class="skip" href="#main">{{ t.skip }}</a>
<header class="container py-4 border-bottom"><div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
<a class="brand" href="{% url 'home' %}"><span class="brand-mark">φ</span>áurea<span class="fw-normal">lab</span></a>
<div class="d-flex align-items-center gap-4 flex-wrap">
<a class="text-decoration-none small d-none d-md-inline" href="{% url 'home' %}#method">{{ t.nav }}</a>
<form action="{% url 'language' %}" method="post" class="d-flex gap-1" aria-label="{{ t.selected }}">{% csrf_token %}<input type="hidden" name="token" value="{{ token }}">
<button class="btn lang-button {% if lang == 'es' %}btn-primary{% else %}btn-outline-primary{% endif %}" name="language" value="es" lang="es" aria-pressed="{% if lang == 'es' %}true{% else %}false{% endif %}"><img src="{% static 'lab/es.svg' %}" class="language-flag" alt=""> Español</button>
<button class="btn lang-button {% if lang == 'en' %}btn-primary{% else %}btn-outline-primary{% endif %}" name="language" value="en" lang="en" aria-pressed="{% if lang == 'en' %}true{% else %}false{% endif %}"><img src="{% static 'lab/gb.svg' %}" class="language-flag" alt=""> English</button>
</form></div></div></header>
<main id="main" class="container">{% block content %}{% endblock %}</main>
<footer class="container py-4 mt-5 border-top">
<details id="privacy" class="mb-4"><summary>{{ t.privacy }}</summary><div class="row mt-3 small text-secondary"><div class="col-md-6"><p>{{ t.privacy_body }}</p></div><div class="col-md-6"><p>{{ t.cookies }}</p>
<form action="{% url 'language' %}" method="post">{% csrf_token %}<button class="btn btn-sm btn-outline-primary" name="language" value="reset">{{ t.reset }}</button></form></div></div></details>
<div class="d-flex justify-content-between gap-3 flex-wrap footer-text text-secondary"><span>{{ t.credit }}</span><span>φ = 1.6180339887…</span></div></footer>
</body></html>
