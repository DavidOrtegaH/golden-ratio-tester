name: Publish Golden Ratio Tester to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
      E2E_PYTHON: python
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements.lock
      - run: npm ci
      - run: npm run build
      - run: npm run build:pages
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
